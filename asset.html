<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>자산, VRINGON CAD</title>
<link rel="icon" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/vringon.css" />
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  .av { display: flex; flex-direction: column; height: calc(100vh - 55px); }
  .av-head { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .av-head h1 { font-size: 16px; font-weight: 700; }
  .av-head .id { font-size: 11.5px; color: var(--text-3); font-family: ui-monospace, monospace; }
  .av-body { flex: 1; display: flex; min-height: 0; }
  .av-left { width: 250px; border-right: 1px solid var(--line); background: var(--bg-2); overflow-y: auto; flex-shrink: 0; }
  .av-mid { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .av-right { width: 300px; border-left: 1px solid var(--line); background: var(--bg-2); overflow-y: auto; flex-shrink: 0; }
  .av-stage { flex: 1; position: relative; background: #0C0C10; min-height: 0; }
  .av-stage canvas { display: block; width: 100%; height: 100%; }
  .av-bottom { height: 190px; border-top: 1px solid var(--line); background: var(--bg-2); display: flex; flex-direction: column; }
  .blk { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .blk h3 { font-size: 11.5px; font-weight: 700; color: var(--text-3); letter-spacing: .04em;
    text-transform: uppercase; margin-bottom: 10px; }
  .tree-row { display: flex; align-items: center; gap: 7px; padding: 5px 7px; border-radius: 6px;
    font-size: 12.5px; color: var(--text-2); cursor: pointer; }
  .tree-row:hover { background: #1A1A20; color: var(--text); }
  .tree-row.on { background: var(--accent-soft); color: var(--text); }
  .tree-row .dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
  .tree-row .st { margin-left: auto; font-size: 10px; color: var(--text-3); }
  .bom-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; font-size: 11.5px;
    padding: 4px 0; color: var(--text-2); border-bottom: 1px solid rgba(255,255,255,.04); }
  .bom-row b { font-family: ui-monospace, monospace; font-size: 10.5px; color: var(--text-3); display: block; }
  .rel { font-size: 11.5px; color: var(--text-2); padding: 4px 0; display: flex; gap: 6px; align-items: baseline; }
  .rel em { font-style: normal; color: var(--text-3); font-size: 10.5px; }
  /* relations read as sentences, grouped by what they do to the machine */
  .relg { margin-bottom: 12px; }
  .relg-t { font-size: 11px; font-weight: 700; color: var(--text-2); letter-spacing: .02em;
    padding-bottom: 5px; margin-bottom: 5px; border-bottom: 1px solid var(--line); display: flex; }
  .relg-t span { margin-left: auto; color: var(--text-3); font-weight: 600; }
  .relr { padding: 6px 8px; border-radius: 7px; margin-bottom: 3px; cursor: pointer; }
  .relr:hover { background: #1A1A20; }
  .relr-x { font-size: 11.5px; color: var(--text-2); line-height: 1.55; }
  .relr-b { font-size: 10.5px; color: var(--text-3); margin-top: 3px; }
  .relr-r { font-size: 10.5px; color: var(--warn); margin-top: 3px; }
  .stepr { display: flex; gap: 9px; padding: 8px 9px; border-radius: 8px; cursor: pointer; font-size: 12px;
    color: var(--text-2); border: 1px solid transparent; }
  .stepr:hover { background: #1A1A20; }
  .stepr.on { background: var(--accent-soft); border-color: rgba(91,107,240,.35); color: var(--text); }
  .stepr .n { width: 20px; height: 20px; border-radius: 5px; background: #22222A; display: grid;
    place-items: center; font-size: 10.5px; font-weight: 700; flex-shrink: 0; }
  .stepr.on .n { background: var(--accent); color: #fff; }
  .stepr .warn2 { color: var(--warn); font-size: 10.5px; margin-top: 3px; }
  .tabsb { display: flex; gap: 3px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); }
  .tabsb button { padding: 6px 12px; font-size: 12px; font-weight: 650; color: var(--text-3);
    border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabsb button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabc { flex: 1; overflow-y: auto; padding: 12px 16px; font-size: 12px; color: var(--text-2); }
  .fl { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border: 1px solid var(--line);
    border-radius: 7px; margin-bottom: 6px; font-size: 12px; }
  .fl b { width: 52px; font-size: 11px; }
  .fl span { flex: 1; color: var(--text-3); font-size: 11px; }
  .av-tools { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 6px;
    background: rgba(18,18,22,.86); border: 1px solid var(--line-2); border-radius: 9px; padding: 5px; }
  .av-tools button { padding: 6px 11px; font-size: 11.5px; font-weight: 600; color: var(--text-2); border-radius: 6px; }
  .av-tools button:hover, .av-tools button.on { background: #26262E; color: var(--text); }
  .sel-note { position: absolute; right: 14px; top: 14px; background: rgba(18,18,22,.9);
    border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 12px; font-size: 12px; display: none; max-width: 260px; }
  .kv2 { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; color: var(--text-2); }
  .kv2 b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>

<div class="ws-top">
  <a class="brand" href="index.html">
    <svg width="24" height="16" viewBox="0 0 46 30" fill="none"><path d="M2 3 12 27 21 3" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="33" cy="15" r="11.5" stroke="currentColor" stroke-width="5"/></svg>
    VRINGON CAD
  </a>
  <a class="btn btn-ghost btn-sm" href="library.html?tab=asset">← 자산 카탈로그</a>
  <span class="sp" style="flex:1"></span>
  <span class="tag" id="userTag">—</span>
  <button class="btn btn-ghost btn-sm" id="btnLogout">로그아웃</button>
</div>

<div class="av">
  <div class="av-head">
    <h1 id="aName">—</h1>
    <span class="id" id="aId"></span>
    <span class="tag" id="aStatus"></span>
    <span class="sp" style="flex:1"></span>
    <span class="tag tag-accent" id="aReady"></span>
  </div>

  <div class="av-body">
    <!-- 왼쪽: 제품·부품 계층 / BOM / 버전 -->
    <aside class="av-left">
      <div class="blk">
        <h3>제품 구조</h3>
        <div id="tree"></div>
      </div>
      <div class="blk">
        <h3>BOM</h3>
        <div id="bom"></div>
      </div>
      <div class="blk">
        <h3>버전 · Variant</h3>
        <div id="ver"></div>
      </div>
    </aside>

    <!-- 가운데: 3D + 절차 재생 -->
    <div class="av-mid">
      <div class="av-stage" id="stage">
        <div class="av-tools">
          <button id="tFit">화면 맞춤</button>
          <button id="tExplode">분해도</button>
          <button id="tSweep">동작 시뮬레이션</button>
          <button id="tReset">초기화</button>
        </div>
        <div class="sel-note" id="selNote"></div>
      </div>
      <div class="av-bottom">
        <div class="tabsb" id="btabs">
          <button data-t="proc" class="on">조립 · 정비 절차</button>
          <button data-t="files">파생 파일</button>
          <button data-t="hist">변경 이력</button>
          <button data-t="ops">검수 · 운영</button>
          <button data-t="spec">실행 사양서</button>
        </div>
        <div class="tabc" id="btabc"></div>
      </div>
    </div>

    <!-- 오른쪽: 부품 정보 / 재질 / 관계 / 공급 -->
    <aside class="av-right">
      <div class="blk">
        <h3>기본 정보</h3>
        <div id="basic"></div>
      </div>
      <div class="blk">
        <h3 id="partHead">부품 정보</h3>
        <div id="partInfo"><div class="hint">3D에서 파트를 선택하거나 왼쪽 구조에서 고르세요.</div></div>
      </div>
      <div class="blk">
        <h3>관계 정보</h3>
        <div id="rels"></div>
      </div>
      <div class="blk">
        <h3>유사 자산 (3D 형상)</h3>
        <div id="similar"><div class="hint">계산 중…</div></div>
      </div>
    </aside>
  </div>
</div>

<script type="module" src="./js/asset-view.js"></script>
</body>
</html>
