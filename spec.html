<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>자산 실행 사양서 생성 — VRINGON CAD</title>
<link rel="icon" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/vringon.css" />
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  .sd { max-width: 940px; margin: 30px auto; padding: 0 24px 80px; }
  .sd h1 { font-size: 20px; margin-bottom: 6px; }
  .sd p.lead2 { font-size: 13.5px; color: var(--text-2); margin-bottom: 18px; line-height: 1.75; }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line);
    border-radius: 9px; margin-bottom: 6px; font-size: 12.5px; background: var(--panel); }
  .row b { flex: 1; font-weight: 600; }
  .row .cat { font-size: 11px; color: var(--text-3); min-width: 92px; }
  .row .st { font-size: 11px; color: var(--text-2); min-width: 300px; text-align: right; }
  #prog { font-size: 12.5px; color: var(--text-2); }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="library.html">VRINGON CAD</a>
  <span class="crumb">자산 실행 사양서</span>
</header>

<main class="sd">
  <h1>자산 실행 사양서 생성</h1>
  <p class="lead2">
    저장된 3D 자산을 직접 열어 파트별로 표현 전략을 판정합니다. 회전체·각형 프리미티브를 실제로 맞춰 보고
    잔차가 작은 파트만 파라메트릭으로 재구축 대상으로 표시하며, 프리미티브가 재현하지 못하는 파트는
    원본 메시를 유지합니다. 결과는 제품 설명문이 아니라 Three.js 런타임 실행 사양으로 저장되어
    자산 상세 화면에서 확인할 수 있습니다. 이미지가 아니라 실제 3D를 보고 작성합니다.
  </p>
  <div class="bar">
    <button id="go" class="btn btn-primary btn-sm">사양서 생성 시작</button>
    <span id="prog">불러오는 중</span>
  </div>
  <div id="list"></div>
</main>

<script type="module" src="./js/spec-run.js"></script>
</body>
</html>
